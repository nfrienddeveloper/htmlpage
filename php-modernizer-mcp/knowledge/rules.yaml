# Conversion heuristics ruleset — the editable, machine-readable core of the expert.
# Each rule maps a detectable procedural SMELL to a recommended OOP MOVE, the
# authority behind it, and the tooling that helps. The `assess_codebase`,
# `convert_snippet`, and `review_conversion` tools load this file. ADD RULES HERE
# to train the expert — this is the primary, reviewable "training surface".

version: 2
meta:
  description: Procedural-PHP smells and their OOP remedies.
  # Bump `version` and add a changelog entry in TRAINING.md when you edit.

rules:
  - id: global-keyword
    smell: "Use of the `global` keyword to reach shared state."
    detect: '\bglobal\s+\$'
    move: "Parameterize Constructor — inject the dependency instead of reaching for it."
    principle: [DIP]
    authority: "Feathers (Parameterize Constructor); Martin (DIP)"
    tooling: []
    severity: high

  - id: superglobal-in-logic
    smell: "Direct access to $_GET/$_POST/$_REQUEST/$_SESSION/$_COOKIE inside business logic."
    detect: '\$_(GET|POST|REQUEST|SESSION|COOKIE|SERVER|FILES)\b'
    move: "Move HTTP/session access to the edge (PSR-7 Request / a Session object) and inject parsed values."
    principle: [SRP, DIP]
    authority: "PSR-7; Jones (separate presentation/input from domain)"
    tooling: []
    severity: high

  - id: new-in-logic
    smell: "Instantiating collaborators with `new` in the middle of logic."
    detect: '=\s*new\s+[A-Z]'
    move: "Inject the collaborator (Extract Interface if a test double is needed)."
    principle: [DIP]
    authority: "Martin (DIP); Feathers (Extract Interface)"
    tooling: []
    severity: medium

  - id: switch-on-type
    smell: "switch/if-else dispatching on a type or kind flag."
    detect: 'switch\s*\(\s*\$\w*(type|kind|status|mode)\w*\s*\)'
    move: "Replace Conditional with Polymorphism — Strategy + Factory."
    principle: [OCP, LSP]
    authority: "Fowler (Replace Conditional with Polymorphism); GoF Strategy"
    tooling: []
    severity: medium

  - id: time-in-logic
    smell: "Calling date()/time()/now in logic — untestable hidden dependency."
    detect: '\b(time|date|mktime|strtotime)\s*\('
    move: "Inject a PSR-20 ClockInterface; pass time in."
    principle: [DIP]
    authority: "PSR-20; Feathers (sense/separate)"
    tooling: []
    severity: medium

  - id: echo-html-in-logic
    smell: "echo/print or inline HTML inside business logic."
    detect: '\b(echo|print)\b|\?>'
    move: "Extract presentation into a Responder/template; return data, render at the edge."
    principle: [SRP]
    authority: "Jones (ADR / separate presentation)"
    tooling: []
    severity: medium

  - id: raw-db-calls
    smell: "Scattered mysqli_*/pg_*/inline SQL in business logic."
    detect: '\b(mysqli_|mysql_|pg_query|->query\()'
    move: "Isolate persistence behind a Repository / Table Data Gateway; inject it."
    principle: [SRP, DIP]
    authority: "Fowler PoEAA (Repository/Gateway); Jones"
    tooling: []
    severity: high

  - id: error-codes
    smell: "Returning false/-1/null to signal errors; mixed return types."
    detect: 'return\s+(false|-1|null)\s*;'
    move: "Replace Error Code with Exception; use typed returns / Null Object."
    principle: [LSP]
    authority: "Fowler (Replace Error Code with Exception)"
    tooling: []
    severity: low

  - id: long-include-chains
    smell: "require/include of logic files instead of autoloading."
    detect: '\b(require|include)(_once)?\b'
    move: "Adopt PSR-4 autoloading via Composer; convert included libs to classes."
    principle: [SRP]
    authority: "PSR-4; Jones (Phase 1)"
    tooling: [composer, rector]
    severity: high

  - id: static-service-locator
    smell: "Static singletons / global service locators (Foo::getInstance())."
    detect: '::getInstance\s*\('
    move: "Replace with constructor injection via a PSR-11 container."
    principle: [DIP]
    authority: "Martin (DIP); PSR-11"
    tooling: []
    severity: medium

  - id: no-strict-types
    smell: "File missing declare(strict_types=1) (and likely missing param/return types)."
    detect: '^(?![\s\S]*declare\s*\(\s*strict_types)'
    scope: file
    move: "Add declare(strict_types=1); add param/return/property types."
    principle: [LSP]
    authority: "PSR-12 / modern PHP; PHPStan"
    tooling: [rector, phpstan]
    severity: low

  # ── Added in v2: a broader best-practice net ──────────────────────────────

  - id: sql-injection-risk
    smell: "SQL built by interpolating/concatenating variables into the query string."
    detect: '(SELECT|INSERT|INTO|UPDATE|DELETE|WHERE)\b.*\$\w'
    move: "Use parameterized/prepared statements inside a Repository; never interpolate input."
    principle: [SRP, DIP]
    authority: "OWASP; Fowler PoEAA (Repository); PDO prepared statements"
    tooling: [phpstan]
    severity: high

  - id: header-in-logic
    smell: "Calling header()/setcookie()/http_response_code() inside business logic."
    detect: '\b(header|setcookie|http_response_code)\s*\('
    move: "Return a PSR-7 Response from a Responder/controller; set headers at the HTTP edge."
    principle: [SRP]
    authority: "PSR-7; Jones (ADR — Responder owns the response)"
    tooling: []
    severity: medium

  - id: session-start-in-logic
    smell: "session_start()/direct session bootstrapping inside domain code."
    detect: '\bsession_start\s*\('
    move: "Start/abstract the session at the edge; inject a Session object into logic."
    principle: [SRP, DIP]
    authority: "PSR-7/15 (session middleware); Feathers (sense & separate)"
    tooling: []
    severity: medium

  - id: exit-die-in-logic
    smell: "exit/die used for control flow inside reusable logic."
    detect: '\b(exit|die)\s*[\(;]'
    move: "Throw a typed exception or return a result; let the entry point decide how to end."
    principle: [SRP, LSP]
    authority: "Fowler (Replace Error Code with Exception); Jones"
    tooling: []
    severity: medium

  - id: error-suppression
    smell: "The @ error-suppression operator hides failures."
    detect: '@[a-zA-Z_]\w*\s*\('
    move: "Remove @; handle the error explicitly (try/catch, validation, guard clause)."
    principle: []
    authority: "PHP The Right Way; PHPStan (errors must be visible)"
    tooling: [phpstan]
    severity: medium

  - id: extract-compact
    smell: "extract()/compact() create invisible variables / hidden data flow."
    detect: '\b(extract|compact)\s*\('
    move: "Pass an explicit DTO/array of named values; make data flow visible and typed."
    principle: [SRP]
    authority: "Clean Code (explicitness); PHPStan (undefined variables)"
    tooling: [phpstan]
    severity: medium

  - id: globals-array
    smell: "Reading/writing the $GLOBALS superglobal as shared mutable state."
    detect: '\$GLOBALS\s*\['
    move: "Inject a typed Config/registry object instead of global mutable state."
    principle: [DIP]
    authority: "Martin (DIP); Feathers (Parameterize Constructor)"
    tooling: []
    severity: high

  - id: eval-usage
    smell: "eval() executes dynamic code — unsafe and unanalyzable."
    detect: '\beval\s*\('
    move: "Replace with explicit logic, a Strategy map, or a safe parser; never eval input."
    principle: [OCP]
    authority: "OWASP; PHP The Right Way (avoid eval)"
    tooling: [phpstan]
    severity: high

  - id: create-function
    smell: "create_function() — removed in PHP 8; string-built callbacks."
    detect: '\bcreate_function\s*\('
    move: "Replace with a closure / arrow function / first-class callable."
    principle: []
    authority: "PHP 8 migration; modern PHP idioms"
    tooling: [rector]
    severity: high

  - id: each-deprecated
    smell: "each() — removed in PHP 8."
    detect: '\beach\s*\('
    move: "Use foreach / array functions."
    principle: []
    authority: "PHP 8 migration"
    tooling: [rector]
    severity: high

  - id: goto-usage
    smell: "goto creates unstructured control flow."
    detect: '\bgoto\s+\w'
    move: "Restructure with loops, early returns, extracted methods, or state objects."
    principle: [SRP]
    authority: "Structured programming; Clean Code"
    tooling: []
    severity: medium

  - id: debug-output
    smell: "var_dump/print_r/var_export left in code as debugging."
    detect: '\b(var_dump|print_r|var_export)\s*\('
    move: "Remove; use an injected PSR-3 logger for diagnostics."
    principle: [SRP]
    authority: "PSR-3; production hygiene"
    tooling: []
    severity: low

  - id: mixed-concerns-file
    smell: "A single file mixes input handling, business logic, persistence, and HTML output."
    detect: '(?=[\s\S]*(echo|\?>))[\s\S]*(mysqli_|->query\(|SELECT|INSERT)'
    scope: file
    move: "Split into layers: Action (input) → Domain (logic) → Repository (data) → Responder (output)."
    principle: [SRP]
    authority: "Jones (ADR/layering); Martin (SRP/Clean Architecture)"
    tooling: []
    severity: high
